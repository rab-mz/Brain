<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brain</title>
    <script>
      // Apply the saved theme and font before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('brain:theme')
        if (['dark', 'light', 'sepia', 'ocean'].indexOf(t) >= 0) document.documentElement.dataset.theme = t
        var f = localStorage.getItem('brain:font')
        if (['sans', 'serif', 'mono'].indexOf(f) >= 0) document.documentElement.dataset.font = f
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
