<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brain</title>
    <meta name="description" content="Local-first notes and scratchpad for developers." />
    <meta name="theme-color" content="#16131f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="Brain" />
    <meta property="og:description" content="Local-first notes and scratchpad for developers." />
    <meta property="og:image" content="https://rab-mz.github.io/Brain/og-image.png" />
    <meta property="og:url" content="https://rab-mz.github.io/Brain/" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme and font before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('brain:theme')
        if (['dark', 'light', 'sepia', 'ocean'].indexOf(t) >= 0) document.documentElement.dataset.theme = t
        var f = localStorage.getItem('brain:font')
        if (['sans', 'serif', 'mono'].indexOf(f) >= 0) document.documentElement.dataset.font = f
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
